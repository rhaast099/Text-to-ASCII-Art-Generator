<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ASCII Art Studio</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><p class="eyebrow">OFFLINE TEXT LAB</p><h1>ASCII Art Studio</h1><p>Full local FIGlet font library and live output.</p></header><div class="workspace"><section class="panel controls"><label>Input text<textarea id="text" rows="5"></textarea></label><label>Search fonts<input id="font-search" placeholder="e.g. Graffiti"></label><label>Style filter<select id="font-filter"><option value="none">None</option><option value="3d">3D</option><option value="shadow">Shadow</option><option value="block">Block / Banner</option><option value="script">Script / Graffiti</option><option value="small">Small</option></select></label><label>ASCII font<select id="font"></select></label><button id="test-all" class="secondary">Test all fonts</button><p id="notice" class="warning" aria-live="polite"></p></section><section class="panel output"><div class="output-title"><div><p class="eyebrow">LIVE PREVIEW</p><h2>Generated art</h2></div><span id="status" aria-live="polite"></span></div><div class="preview-shell"><div id="stage"><pre id="preview"></pre><div id="gallery" hidden></div></div></div><div class="actions"><button id="copy">Copy text</button><button id="download-txt" class="secondary">Download TXT</button><button id="download-png" class="secondary">Export PNG</button></div><p class="hint">Every card in the all-fonts view has its own copy and export controls.</p></section></div></main><script type="module" src="app.js"></script></body></html>
